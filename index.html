<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>West Bengal 23 Districts - 6 Seasons Map</title>
  <!-- D3.js লাইব্রেরি আসল জিওমেট্রি রেন্ডার করার জন্য -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <style>
    :root {
      --bg: #030712;
      --card: rgba(15, 23, 42, 0.95);
      --border: rgba(51, 65, 85, 0.7);
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .title h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .title p {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .badge {
      text-align: right;
    }

    .badge .metric {
      font-size: 1.35rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .badge .sub {
      font-size: 0.65rem;
      color: var(--muted);
    }

    .season-info {
      margin-bottom: 8px;
    }

    .season-name {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .season-sub {
      font-size: 0.75rem;
      color: #38bdf8;
    }

    .map-wrapper {
      position: relative;
      width: 100%;
      height: 520px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg {
      width: 100%;
      height: 100%;
    }

    .district {
      stroke: #030712;
      stroke-width: 0.8px;
      cursor: pointer;
      transition: fill 0.8s ease, stroke 0.2s, filter 0.2s;
    }

    .district:hover {
      stroke: #ffffff;
      stroke-width: 1.8px;
      filter: brightness(1.25);
    }

    .legend-bar {
      height: 6px;
      border-radius: 999px;
      width: 100%;
      margin-top: 8px;
      transition: background 0.8s ease;
    }

    .timeline {
      display: flex;
      gap: 5px;
      margin-top: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .timeline-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .timeline-pillar {
      width: 100%;
      background: #1e293b;
      height: 22px;
      border-radius: 3px;
      transition: background 0.3s;
    }

    .timeline-item.active .timeline-pillar {
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    .timeline-label {
      font-size: 0.65rem;
      color: var(--muted);
      font-weight: 500;
    }

    .timeline-item.active .timeline-label {
      color: #38bdf8;
      font-weight: 700;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .btn {
      background: #38bdf8;
      color: #030712;
      font-weight: 700;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .tooltip {
      position: absolute;
      background: rgba(3, 7, 18, 0.95);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 0.72rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      white-space: nowrap;
      z-index: 10;
    }

    #loading-overlay {
      position: absolute;
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title">
        <h1>West Bengal Map</h1>
        <p>23 Districts Real GIS Boundaries & 6 Seasons</p>
      </div>
      <div class="badge">
        <div class="metric" id="metric-val">42°C</div>
        <div class="sub" id="metric-lbl">Peak Temperature</div>
      </div>
    </div>

    <div class="season-info">
      <div class="season-name" id="s-name">1. Grishma (Summer)</div>
      <div class="season-sub" id="s-sub">Boishakh — Joishtho | High Heatwave</div>
    </div>

    <div class="map-wrapper">
      <div id="tooltip" class="tooltip"></div>
      <div id="loading-overlay">Loading authentic district boundaries...</div>
      <svg id="wb-svg" viewBox="0 0 450 560"></svg>
    </div>

    <div class="legend-bar" id="legend-strip"></div>
    <div class="timeline" id="timeline"></div>

    <div class="footer">
      <button class="btn" id="play-btn" onclick="togglePlay()">Pause</button>
      <span style="font-size: 0.68rem; color: var(--muted);">Authentic Survey GIS Map</span>
    </div>
  </div>

  <script>
    const seasonData = [
      {
        bn: "1. Grishma (গ্রীষ্মকাল / Summer)",
        tag: "Grishma",
        sub: "Boishakh — Joishtho | High Heatwave in Western Rarh",
        metric: "43°C",
        lbl: "Purulia/Bankura Peak Heat",
        grad: "linear-gradient(to right, #facc15, #ea580c, #7f1d1d)",
        colors: {
          "Purulia": "#7f1d1d", "Bankura": "#991b1b", "Jhargram": "#991b1b",
          "Paschim Bardhaman": "#b91c1c", "Birbhum": "#dc2626", "Paschim Medinipur": "#dc2626",
          "Purba Bardhaman": "#ea580c", "Hooghly": "#ea580c", "Howrah": "#ea580c", "Kolkata": "#ea580c",
          "Nadia": "#f97316", "Murshidabad": "#f97316", "Maldah": "#f97316", "Malda": "#f97316",
          "North 24 Parganas": "#f97316", "South 24 Parganas": "#f97316", "Purba Medinipur": "#f97316",
          "Uttar Dinajpur": "#fb923c", "Dakshin Dinajpur": "#fb923c",
          "Koch Bihar": "#facc15", "Coochbehar": "#facc15", "Alipurduar": "#facc15", "Jalpaiguri": "#facc15",
          "Kalimpong": "#fde047", "Darjeeling": "#fef08a", "Darjiling": "#fef08a"
        }
      },
      {
        bn: "2. Barsha (বর্ষাকাল / Monsoon)",
        tag: "Barsha",
        sub: "Asharh — Srabon | Heavy Rainfall in Dooars & Sundarban",
        metric: "380mm",
        lbl: "Sub-Himalayan Rain",
        grad: "linear-gradient(to right, #082f49, #0284c7, #38bdf8)",
        colors: {
          "Alipurduar": "#38bdf8", "Jalpaiguri": "#38bdf8", "Kalimpong": "#0284c7",
          "Darjeeling": "#0284c7", "Darjiling": "#0284c7", "Koch Bihar": "#38bdf8", "Coochbehar": "#38bdf8",
          "Uttar Dinajpur": "#0284c7", "Dakshin Dinajpur": "#0369a1", "Maldah": "#0369a1", "Malda": "#0369a1",
          "Murshidabad": "#075985", "Nadia": "#0369a1", "North 24 Parganas": "#0284c7", "South 24 Parganas": "#38bdf8",
          "Kolkata": "#0284c7", "Howrah": "#0284c7", "Hooghly": "#0369a1",
          "Purba Medinipur": "#0284c7", "Paschim Medinipur": "#075985",
          "Purba Bardhaman": "#075985", "Paschim Bardhaman": "#0c4a6e",
          "Birbhum": "#0c4a6e", "Bankura": "#082f49", "Purulia": "#082f49", "Jhargram": "#0c4a6e"
        }
      },
      {
        bn: "3. Sharat (শরৎকাল / Autumn)",
        tag: "Sharat",
        sub: "Bhadro — Ashwin | Kashful, Clear Blue Skies & Durga Puja",
        metric: "Clear Sky",
        lbl: "Festive Season",
        grad: "linear-gradient(to right, #064e3b, #10b981, #6ee7b7)",
        colors: {
          "Kolkata": "#6ee7b7", "Howrah": "#6ee7b7", "Hooghly": "#6ee7b7",
          "North 24 Parganas": "#34d399", "South 24 Parganas": "#34d399", "Nadia": "#34d399",
          "Purba Bardhaman": "#34d399", "Paschim Bardhaman": "#10b981", "Murshidabad": "#10b981",
          "Birbhum": "#10b981", "Bankura": "#10b981", "Purulia": "#059669",
          "Jhargram": "#059669", "Paschim Medinipur": "#10b981", "Purba Medinipur": "#34d399",
          "Maldah": "#059669", "Malda": "#059669", "Uttar Dinajpur": "#059669", "Dakshin Dinajpur": "#059669",
          "Koch Bihar": "#047857", "Coochbehar": "#047857", "Jalpaiguri": "#047857", "Alipurduar": "#047857",
          "Kalimpong": "#065f46", "Darjeeling": "#064e3b", "Darjiling": "#064e3b"
        }
      },
      {
        bn: "4. Hemanta (হেমন্তকাল / Late Autumn)",
        tag: "Hemanta",
        sub: "Kartik — Agrahayan | Golden Harvest (Nabanna) in Bengal",
        metric: "Harvest Hue",
        lbl: "Paddy Fields of Bengal",
        grad: "linear-gradient(to right, #78350f, #d97706, #fde68a)",
        colors: {
          "Purba Bardhaman": "#fde68a", "Hooghly": "#fde68a", "Nadia": "#fde68a",
          "Paschim Medinipur": "#fde68a", "Murshidabad": "#f59e0b", "Birbhum": "#f59e0b",
          "Purba Medinipur": "#f59e0b", "Howrah": "#f59e0b", "North 24 Parganas": "#f59e0b",
          "South 24 Parganas": "#d97706", "Kolkata": "#f59e0b", "Bankura": "#d97706",
          "Paschim Bardhaman": "#d97706", "Maldah": "#d97706", "Malda": "#d97706",
          "Dakshin Dinajpur": "#d97706", "Purulia": "#b45309", "Jhargram": "#b45309",
          "Uttar Dinajpur": "#b45309", "Koch Bihar": "#b45309", "Coochbehar": "#b45309",
          "Jalpaiguri": "#92400e", "Alipurduar": "#92400e", "Kalimpong": "#78350f",
          "Darjeeling": "#78350f", "Darjiling": "#78350f"
        }
      },
      {
        bn: "5. Sheet (শীতকাল / Winter)",
        tag: "Sheet",
        sub: "Poush — Magh | Frost in Darjeeling, Cold Wave in Rarh",
        metric: "3°C",
        lbl: "Sandakphu Chill",
        grad: "linear-gradient(to right, #1e1b4b, #6366f1, #e0e7ff)",
        colors: {
          "Darjeeling": "#e0e7ff", "Darjiling": "#e0e7ff", "Kalimpong": "#c7d2fe",
          "Jalpaiguri": "#a5b4fc", "Alipurduar": "#a5b4fc", "Koch Bihar": "#818cf8", "Coochbehar": "#818cf8",
          "Uttar Dinajpur": "#818cf8", "Dakshin Dinajpur": "#6366f1", "Maldah": "#6366f1", "Malda": "#6366f1",
          "Purulia": "#3730a3", "Bankura": "#3730a3", "Birbhum": "#4338ca", "Jhargram": "#3730a3",
          "Paschim Bardhaman": "#4338ca", "Purba Bardhaman": "#4f46e5", "Murshidabad": "#4f46e5",
          "Nadia": "#4f46e5", "Hooghly": "#6366f1", "Howrah": "#6366f1",
          "Kolkata": "#6366f1", "North 24 Parganas": "#6366f1", "Purba Medinipur": "#6366f1",
          "Paschim Medinipur": "#4338ca", "South 24 Parganas": "#4f46e5"
        }
      },
      {
        bn: "6. Basanta (বসন্তকাল / Spring)",
        tag: "Basanta",
        sub: "Falgun — Choitro | Red Palash Blooms in Purulia & Bankura",
        metric: "Palash Red",
        lbl: "Spring Equinox Bloom",
        grad: "linear-gradient(to right, #831843, #db2777, #f472b6)",
        colors: {
          "Purulia": "#f43f5e", "Bankura": "#f43f5e", "Jhargram": "#f43f5e",
          "Birbhum": "#fb7185", "Paschim Bardhaman": "#e11d48", "Paschim Medinipur": "#fb7185",
          "Purba Bardhaman": "#ec4899", "Nadia": "#f472b6", "Hooghly": "#ec4899",
          "Howrah": "#ec4899", "Kolkata": "#f472b6", "Purba Medinipur": "#db2777",
          "North 24 Parganas": "#ec4899", "South 24 Parganas": "#db2777",
          "Murshidabad": "#db2777", "Maldah": "#db2777", "Malda": "#db2777",
          "Dakshin Dinajpur": "#be185d", "Uttar Dinajpur": "#be185d",
          "Koch Bihar": "#be185d", "Coochbehar": "#be185d", "Jalpaiguri": "#9d174d",
          "Alipurduar": "#9d174d", "Kalimpong": "#9d174d", "Darjeeling": "#831843", "Darjiling": "#831843"
        }
      }
    ];

    let currentIdx = 0;
    let timer = null;
    let isPlaying = true;
    let districtPaths = null;

    // Timeline বার তৈরি
    const timelineEl = document.getElementById('timeline');
    seasonData.forEach((s, idx) => {
      const item = document.createElement('div');
      item.className = 'timeline-item ' + (idx === 0 ? 'active' : '');
      item.onclick = () => selectSeason(idx);

      const pillar = document.createElement('div');
      pillar.className = 'timeline-pillar';

      const label = document.createElement('div');
      label.className = 'timeline-label';
      label.textContent = s.tag;

      item.appendChild(pillar);
      item.appendChild(label);
      timelineEl.appendChild(item);
    });

    const svg = d3.select("#wb-svg");
    const width = 450;
    const height = 560;

    // অফিশিয়াল ও সম্পূর্ণ নির্ভরযোগ্য West Bengal Districts GeoJSON (GitHub Pages-এ এটি কখনো ব্লক হয় না)
    const WB_GEOJSON = "https://raw.githubusercontent.com/HindustanTimesLabs/shapefiles/master/state_ut/westbengal/district/westbengal_district.json";

    d3.json(WB_GEOJSON).then(geoData => {
      document.getElementById('loading-overlay').style.display = 'none';

      // নিখুঁত বাউন্ডারি প্রোজেকশন
      const projection = d3.geoMercator().fitSize([width, height], geoData);
      const pathGenerator = d3.geoPath().projection(projection);

      districtPaths = svg.selectAll(".district")
        .data(geoData.features)
        .enter()
        .append("path")
        .attr("class", "district")
        .attr("d", pathGenerator);

      // Tooltip Hover
      const tooltip = document.getElementById("tooltip");
      districtPaths.on("mousemove", (event, d) => {
        const name = d.properties.district || d.properties.NAME_2 || d.properties.dtname || "District";
        tooltip.style.left = (event.offsetX + 10) + "px";
        tooltip.style.top = (event.offsetY - 20) + "px";
        tooltip.textContent = name;
        tooltip.style.opacity = "1";
      }).on("mouseleave", () => {
        tooltip.style.opacity = "0";
      });

      applySeason(0);
      startLoop();
    }).catch(err => {
      document.getElementById('loading-overlay').textContent = "Map boundary load error. Check internet connection.";
    });

    function matchDistrictColor(dName, colorMap) {
      if (!dName) return "#38bdf8";
      const clean = dName.toLowerCase().replace(/[^a-z]/g, '');
      for (let k in colorMap) {
        const target = k.toLowerCase().replace(/[^a-z]/g, '');
        if (clean.includes(target) || target.includes(clean)) {
          return colorMap[k];
        }
      }
      return "#38bdf8";
    }

    function applySeason(idx) {
      const s = seasonData[idx];
      document.getElementById('s-name').textContent = s.bn;
      document.getElementById('s-sub').textContent = s.sub;
      document.getElementById('metric-val').textContent = s.metric;
      document.getElementById('metric-lbl').textContent = s.lbl;
      document.getElementById('legend-strip').style.background = s.grad;

      if (districtPaths) {
        districtPaths.each(function(d, i) {
          const dName = d.properties.district || d.properties.NAME_2 || d.properties.dtname;
          const targetColor = matchDistrictColor(dName, s.colors);
          d3.select(this)
            .transition()
            .delay(i * 15)
            .duration(650)
            .style("fill", targetColor);
        });
      }

      document.querySelectorAll('.timeline-item').forEach((item, i) => {
        item.classList.toggle('active', i === idx);
      });
    }

    function selectSeason(idx) {
      currentIdx = idx;
      applySeason(currentIdx);
    }

    function nextSeason() {
      currentIdx = (currentIdx + 1) % seasonData.length;
      applySeason(currentIdx);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('play-btn');
      if (isPlaying) {
        btn.textContent = 'Pause';
        startLoop();
      } else {
        btn.textContent = 'Play';
        clearInterval(timer);
      }
    }

    function startLoop() {
      clearInterval(timer);
      timer = setInterval(nextSeason, 2800);
    }
  </script>
</body>
</html>
