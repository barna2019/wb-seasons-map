<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>West Bengal 23 Districts - 6 Seasons Map</title>
  <!-- D3.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <style>
    :root {
      --bg: #030712;
      --card: rgba(15, 23, 42, 0.95);
      --border: rgba(51, 65, 85, 0.7);
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.85);
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .title h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .title p {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .badge {
      text-align: right;
    }

    .badge .metric {
      font-size: 1.35rem;
      font-weight: 800;
      color: #38bdf8;
    }

    .badge .sub {
      font-size: 0.65rem;
      color: var(--muted);
    }

    .season-info {
      margin-bottom: 8px;
    }

    .season-name {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .season-sub {
      font-size: 0.75rem;
      color: #38bdf8;
    }

    .map-wrapper {
      position: relative;
      width: 100%;
      height: 560px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    svg {
      width: 100%;
      height: 100%;
    }

    .district {
      stroke: #030712;
      stroke-width: 0.8px;
      cursor: pointer;
      transition: fill 0.8s ease, stroke 0.2s, filter 0.2s;
    }

    .district:hover {
      stroke: #ffffff;
      stroke-width: 2px;
      filter: brightness(1.3);
    }

    .legend-bar {
      height: 6px;
      border-radius: 999px;
      width: 100%;
      margin-top: 8px;
      transition: background 0.8s ease;
    }

    .timeline {
      display: flex;
      gap: 5px;
      margin-top: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .timeline-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .timeline-pillar {
      width: 100%;
      background: #1e293b;
      height: 20px;
      border-radius: 3px;
      transition: background 0.3s;
    }

    .timeline-item.active .timeline-pillar {
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    .timeline-label {
      font-size: 0.65rem;
      color: var(--muted);
      font-weight: 500;
    }

    .timeline-item.active .timeline-label {
      color: #38bdf8;
      font-weight: 700;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }

    .btn {
      background: #38bdf8;
      color: #030712;
      font-weight: 700;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .tooltip {
      position: absolute;
      background: rgba(3, 7, 18, 0.95);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.75rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      white-space: nowrap;
      z-index: 10;
    }

    #loading-overlay {
      position: absolute;
      color: #38bdf8;
      font-size: 0.85rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title">
        <h1>West Bengal Map</h1>
        <p>Official 23 Districts GIS Boundary & 6 Seasons</p>
      </div>
      <div class="badge">
        <div class="metric" id="metric-val">42°C</div>
        <div class="sub" id="metric-lbl">রাঢ় অঞ্চলে তাপপ্রবাহ</div>
      </div>
    </div>

    <div class="season-info">
      <div class="season-name" id="s-name">১. গ্রীষ্মকাল (Summer)</div>
      <div class="season-sub" id="s-sub">বৈশাখ — জ্যৈষ্ঠ | চরম উষ্ণতা ও কালবৈশাখী</div>
    </div>

    <div class="map-wrapper">
      <div id="tooltip" class="tooltip"></div>
      <div id="loading-overlay">Loading authentic district boundaries...</div>
      <svg id="wb-svg" viewBox="0 0 450 620"></svg>
    </div>

    <div class="legend-bar" id="legend-strip"></div>
    <div class="timeline" id="timeline"></div>

    <div class="footer">
      <button class="btn" id="play-btn" onclick="togglePlay()">Pause</button>
      <span style="font-size: 0.68rem; color: var(--muted);">Official Survey Boundaries</span>
    </div>
  </div>

  <script>
    const seasonData = [
      {
        bn: "১. গ্রীষ্মকাল / Grishma (Summer)",
        tag: "গ্রীষ্ম",
        sub: "বৈশাখ — জ্যৈষ্ঠ | রাঢ় অঞ্চলে তীব্র দাবদাহ",
        metric: "৪২° সে",
        lbl: "পুরুলিয়া ও বাঁকুড়ায় সর্বোচ্চ তাপ",
        grad: "linear-gradient(to right, #facc15, #ea580c, #7f1d1d)",
        colors: {
          "PURULIA": "#7f1d1d", "BANKURA": "#991b1b", "JHARGRAM": "#991b1b",
          "PASCHIM BARDHAMAN": "#b91c1c", "BIRBHUM": "#dc2626", "PASCHIM MEDINIPUR": "#dc2626",
          "PURBA BARDHAMAN": "#ea580c", "HOOGHLY": "#ea580c", "HUGLI": "#ea580c", "HOWRAH": "#ea580c", 
          "HAORA": "#ea580c", "KOLKATA": "#ea580c", "NORTH 24 PARGANAS": "#f97316", "SOUTH 24 PARGANAS": "#f97316",
          "NADIA": "#f97316", "MURSHIDABAD": "#f97316", "MALDAH": "#f97316", "MALDA": "#f97316",
          "UTTAR DINAJPUR": "#fb923c", "DAKSHIN DINAJPUR": "#fb923c", "COOCH BEHAR": "#facc15", 
          "KOCH BIHAR": "#facc15", "ALIPURDUAR": "#facc15", "ALIPUR DUAR": "#facc15", "JALPAIGURI": "#facc15",
          "KALIMPONG": "#fde047", "DARJEELING": "#fef08a", "DARJILING": "#fef08a"
        }
      },
      {
        bn: "২. বর্ষাকাল / Barsha (Monsoon)",
        tag: "বর্ষা",
        sub: "আষাঢ় — শ্রাবণ | ডুয়ার্স ও সুন্দরবনে অতিবৃষ্টি",
        metric: "৩৮০ মিমি",
        lbl: "উত্তরবঙ্গে সক্রিয় মৌসুমি বায়ু",
        grad: "linear-gradient(to right, #082f49, #0284c7, #38bdf8)",
        colors: {
          "ALIPURDUAR": "#38bdf8", "ALIPUR DUAR": "#38bdf8", "JALPAIGURI": "#38bdf8", 
          "KALIMPONG": "#0284c7", "DARJEELING": "#0284c7", "DARJILING": "#0284c7", 
          "COOCH BEHAR": "#38bdf8", "KOCH BIHAR": "#38bdf8", "UTTAR DINAJPUR": "#0284c7", 
          "DAKSHIN DINAJPUR": "#0369a1", "MALDAH": "#0369a1", "MALDA": "#0369a1",
          "MURSHIDABAD": "#075985", "NADIA": "#0369a1", "NORTH 24 PARGANAS": "#0284c7", 
          "SOUTH 24 PARGANAS": "#38bdf8", "KOLKATA": "#0284c7", "HOWRAH": "#0284c7", 
          "HAORA": "#0284c7", "HOOGHLY": "#0369a1", "HUGLI": "#0369a1", "PURBA MEDINIPUR": "#0284c7", 
          "PASCHIM MEDINIPUR": "#075985", "PURBA BARDHAMAN": "#075985", "PASCHIM BARDHAMAN": "#0c4a6e",
          "BIRBHUM": "#0c4a6e", "BANKURA": "#082f49", "PURULIA": "#082f49", "JHARGRAM": "#0c4a6e"
        }
      },
      {
        bn: "৩. শরৎকাল / Sharat (Autumn)",
        tag: "শরৎ",
        sub: "ভাদ্র — আশ্বিন | কাশফুল, নীল আকাশ ও পুজো",
        metric: "উৎসবমুখর",
        lbl: "স্বচ্ছ আকাশ ও শুভ্র মেঘ",
        grad: "linear-gradient(to right, #064e3b, #10b981, #6ee7b7)",
        colors: {
          "KOLKATA": "#6ee7b7", "HOWRAH": "#6ee7b7", "HAORA": "#6ee7b7", "HOOGHLY": "#6ee7b7", 
          "HUGLI": "#6ee7b7", "NORTH 24 PARGANAS": "#34d399", "SOUTH 24 PARGANAS": "#34d399", 
          "NADIA": "#34d399", "PURBA BARDHAMAN": "#34d399", "PASCHIM BARDHAMAN": "#10b981", 
          "MURSHIDABAD": "#10b981", "BIRBHUM": "#10b981", "BANKURA": "#10b981", "PURULIA": "#059669",
          "JHARGRAM": "#059669", "PASCHIM MEDINIPUR": "#10b981", "PURBA MEDINIPUR": "#34d399",
          "MALDAH": "#059669", "MALDA": "#059669", "UTTAR DINAJPUR": "#059669", 
          "DAKSHIN DINAJPUR": "#059669", "COOCH BEHAR": "#047857", "KOCH BIHAR": "#047857", 
          "JALPAIGURI": "#047857", "ALIPURDUAR": "#047857", "ALIPUR DUAR": "#047857",
          "KALIMPONG": "#065f46", "DARJEELING": "#064e3b", "DARJILING": "#064e3b"
        }
      },
      {
        bn: "৪. হেমন্তকাল / Hemanta (Late Autumn)",
        tag: "হেমন্ত",
        sub: "কার্তিক — অগ্রহায়ণ | সোনালী পাকা ধান ও নবান্ন",
        metric: "সোনালী ধান",
        lbl: "বর্ধমান ও দক্ষিণবঙ্গের নবান্ন",
        grad: "linear-gradient(to right, #78350f, #d97706, #fde68a)",
        colors: {
          "PURBA BARDHAMAN": "#fde68a", "HOOGHLY": "#fde68a", "HUGLI": "#fde68a", "NADIA": "#fde68a",
          "PASCHIM MEDINIPUR": "#fde68a", "MURSHIDABAD": "#f59e0b", "BIRBHUM": "#f59e0b",
          "PURBA MEDINIPUR": "#f59e0b", "HOWRAH": "#f59e0b", "HAORA": "#f59e0b", 
          "NORTH 24 PARGANAS": "#f59e0b", "SOUTH 24 PARGANAS": "#d97706", "KOLKATA": "#f59e0b", 
          "BANKURA": "#d97706", "PASCHIM BARDHAMAN": "#d97706", "MALDAH": "#d97706", "MALDA": "#d97706",
          "DAKSHIN DINAJPUR": "#d97706", "PURULIA": "#b45309", "JHARGRAM": "#b45309", 
          "UTTAR DINAJPUR": "#b45309", "COOCH BEHAR": "#b45309", "KOCH BIHAR": "#b45309",
          "JALPAIGURI": "#92400e", "ALIPURDUAR": "#92400e", "ALIPUR DUAR": "#92400e",
          "KALIMPONG": "#78350f", "DARJEELING": "#78350f", "DARJILING": "#78350f"
        }
      },
      {
        bn: "৫. শীতকাল / Sheet (Winter)",
        tag: "শীত",
        sub: "পৌষ — মাঘ | পাহাড়ে বরফ ও রাঢ়ে শৈত্যপ্রবাহ",
        metric: "৩° সে",
        lbl: "দার্জিলিং পাহাড়ে শৈত্য",
        grad: "linear-gradient(to right, #1e1b4b, #6366f1, #e0e7ff)",
        colors: {
          "DARJEELING": "#e0e7ff", "DARJILING": "#e0e7ff", "KALIMPONG": "#c7d2fe", 
          "JALPAIGURI": "#a5b4fc", "ALIPURDUAR": "#a5b4fc", "ALIPUR DUAR": "#a5b4fc", 
          "COOCH BEHAR": "#818cf8", "KOCH BIHAR": "#818cf8", "UTTAR DINAJPUR": "#818cf8", 
          "DAKSHIN DINAJPUR": "#6366f1", "MALDAH": "#6366f1", "MALDA": "#6366f1", 
          "PURULIA": "#3730a3", "BANKURA": "#3730a3", "BIRBHUM": "#4338ca", "JHARGRAM": "#3730a3",
          "PASCHIM BARDHAMAN": "#4338ca", "PURBA BARDHAMAN": "#4f46e5", "MURSHIDABAD": "#4f46e5",
          "NADIA": "#4f46e5", "HOOGHLY": "#6366f1", "HUGLI": "#6366f1", "HOWRAH": "#6366f1", 
          "HAORA": "#6366f1", "KOLKATA": "#6366f1", "NORTH 24 PARGANAS": "#6366f1", 
          "PURBA MEDINIPUR": "#6366f1", "PASCHIM MEDINIPUR": "#4338ca", "SOUTH 24 PARGANAS": "#4f46e5"
        }
      },
      {
        bn: "৬. বসন্তকাল / Basanta (Spring)",
        tag: "বসন্ত",
        sub: "ফাল্গুন — চৈত্র | জঙ্গলমহলে পলাশের মেলা",
        metric: "পলাশের রঙ",
        lbl: "পুরুলিয়া ও শান্তিনিকেতনে বসন্তোৎসব",
        grad: "linear-gradient(to right, #831843, #db2777, #f472b6)",
        colors: {
          "PURULIA": "#f43f5e", "BANKURA": "#f43f5e", "JHARGRAM": "#f43f5e", 
          "BIRBHUM": "#fb7185", "PASCHIM BARDHAMAN": "#e11d48", "PASCHIM MEDINIPUR": "#fb7185",
          "PURBA BARDHAMAN": "#ec4899", "NADIA": "#f472b6", "HOOGHLY": "#ec4899", "HUGLI": "#ec4899",
          "HOWRAH": "#ec4899", "HAORA": "#ec4899", "KOLKATA": "#f472b6", "PURBA MEDINIPUR": "#db2777",
          "NORTH 24 PARGANAS": "#ec4899", "SOUTH 24 PARGANAS": "#db2777", "MURSHIDABAD": "#db2777",
          "MALDAH": "#db2777", "MALDA": "#db2777", "DAKSHIN DINAJPUR": "#be185d", 
          "UTTAR DINAJPUR": "#be185d", "COOCH BEHAR": "#be185d", "KOCH BIHAR": "#be185d", 
          "JALPAIGURI": "#9d174d", "ALIPURDUAR": "#9d174d", "ALIPUR DUAR": "#9d174d", 
          "KALIMPONG": "#9d174d", "DARJEELING": "#831843", "DARJILING": "#831843"
        }
      }
    ];

    let currentIdx = 0;
    let timer = null;
    let isPlaying = true;
    let districtPaths = null;

    // Timeline bar setup
    const timelineEl = document.getElementById('timeline');
    seasonData.forEach((s, idx) => {
      const item = document.createElement('div');
      item.className = 'timeline-item ' + (idx === 0 ? 'active' : '');
      item.onclick = () => selectSeason(idx);

      const pillar = document.createElement('div');
      pillar.className = 'timeline-pillar';

      const label = document.createElement('div');
      label.className = 'timeline-label';
      label.textContent = s.tag;

      item.appendChild(pillar);
      item.appendChild(label);
      timelineEl.appendChild(item);
    });

    const svg = d3.select("#wb-svg");
    const width = 450;
    const height = 620;

    // Load the renamed file directly from the repo root
    d3.json("wb-seasons-map.json").then(geoData => {
      document.getElementById('loading-overlay').style.display = 'none';

      const projection = d3.geoMercator().fitSize([width, height], geoData);
      const pathGenerator = d3.geoPath().projection(projection);

      districtPaths = svg.selectAll(".district")
        .data(geoData.features)
        .enter()
        .append("path")
        .attr("class", "district")
        .attr("d", pathGenerator);

      // Tooltip Hover interaction
      const tooltip = document.getElementById("tooltip");
      districtPaths.on("mousemove", (event, d) => {
        const name = d.properties.District || d.properties.name || "District";
        tooltip.style.left = (event.offsetX + 10) + "px";
        tooltip.style.top = (event.offsetY - 20) + "px";
        tooltip.textContent = name;
        tooltip.style.opacity = "1";
      }).on("mouseleave", () => {
        tooltip.style.opacity = "0";
      });

      applySeason(0);
      startLoop();
    }).catch(err => {
      document.getElementById('loading-overlay').textContent = "Error: wb-seasons-map.json not found in repository root.";
    });

    function matchDistrictColor(dName, colorMap) {
      if (!dName) return "#38bdf8";
      const clean = dName.toUpperCase().replace(/[^A-Z]/g, '');
      for (let k in colorMap) {
        const target = k.toUpperCase().replace(/[^A-Z]/g, '');
        if (clean.includes(target) || target.includes(clean)) {
          return colorMap[k];
        }
      }
      return "#38bdf8";
    }

    function applySeason(idx) {
      const s = seasonData[idx];
      document.getElementById('s-name').textContent = s.bn;
      document.getElementById('s-sub').textContent = s.sub;
      document.getElementById('metric-val').textContent = s.metric;
      document.getElementById('metric-lbl').textContent = s.lbl;
      document.getElementById('legend-strip').style.background = s.grad;

      if (districtPaths) {
        districtPaths.each(function(d, i) {
          const dName = d.properties.District || d.properties.name;
          const targetColor = matchDistrictColor(dName, s.colors);
          d3.select(this)
            .transition()
            .delay(i * 12)
            .duration(650)
            .style("fill", targetColor);
        });
      }

      document.querySelectorAll('.timeline-item').forEach((item, i) => {
        item.classList.toggle('active', i === idx);
      });
    }

    function selectSeason(idx) {
      currentIdx = idx;
      applySeason(currentIdx);
    }

    function nextSeason() {
      currentIdx = (currentIdx + 1) % seasonData.length;
      applySeason(currentIdx);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('play-btn');
      if (isPlaying) {
        btn.textContent = 'Pause';
        startLoop();
      } else {
        btn.textContent = 'Play';
        clearInterval(timer);
      }
    }

    function startLoop() {
      clearInterval(timer);
      timer = setInterval(nextSeason, 2800);
    }
  </script>
</body>
</html>
